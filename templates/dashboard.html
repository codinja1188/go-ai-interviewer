<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interviewer Dashboard - Go AI Interviewer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>🤖 Go AI Interviewer</h1>
            <div class="nav-menu">
                <span id="username-display"></span>
                <button onclick="logout()" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard">
            <h2>Interviewer Dashboard</h2>
            
            <div class="card">
                <h3>Create New Interview</h3>
                <form id="createInterviewForm">
                    <div class="form-group">
                        <label for="candidateName">Candidate Name</label>
                        <input type="text" id="candidateName" required>
                    </div>
                    <div class="form-group">
                        <label for="candidateEmail">Candidate Email</label>
                        <input type="email" id="candidateEmail" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Interview</button>
                </form>
            </div>

            <div class="card">
                <h3>Active Interviews</h3>
                <div id="interviews-list">
                    <p class="loading">Loading interviews...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        const role = localStorage.getItem('role');

        if (!token || role !== 'interviewer') {
            window.location.href = '/';
        }

        document.getElementById('username-display').textContent = `Welcome, ${username}`;

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        // Create interview
        document.getElementById('createInterviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const candidateName = document.getElementById('candidateName').value;
            const candidateEmail = document.getElementById('candidateEmail').value;

            try {
                const response = await fetch('/api/interviews', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        candidate_name: candidateName,
                        candidate_email: candidateEmail
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('Interview created successfully!');
                    document.getElementById('createInterviewForm').reset();
                    loadInterviews();
                    
                    // Redirect to interview page
                    window.location.href = `/interview/${data.id}`;
                } else {
                    alert('Failed to create interview');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Network error');
            }
        });

        // Load interviews
        async function loadInterviews() {
            try {
                const response = await fetch('/api/interviews', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    displayInterviews(data.sessions || []);
                } else {
                    document.getElementById('interviews-list').innerHTML = '<p class="error">Failed to load interviews</p>';
                }
            } catch (error) {
                document.getElementById('interviews-list').innerHTML = '<p class="error">Network error</p>';
            }
        }

        function displayInterviews(sessions) {
            const container = document.getElementById('interviews-list');
            
            if (sessions.length === 0) {
                container.innerHTML = '<p>No interviews yet. Create one to get started!</p>';
                return;
            }

            const html = sessions.map(session => `
                <div class="interview-item">
                    <div class="interview-info">
                        <strong>${session.candidate_name}</strong>
                        <span>${session.candidate_email}</span>
                        <span class="status status-${session.status}">${session.status}</span>
                    </div>
                    <div class="interview-actions">
                        <span>Score: ${session.total_score.toFixed(1)}%</span>
                        <button onclick="viewInterview('${session.id}')" class="btn btn-small">View Details</button>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function viewInterview(id) {
            window.location.href = `/interview/${id}`;
        }

        // Load interviews on page load
        loadInterviews();
    </script>
</body>
</html>
