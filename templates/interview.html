<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Session - Go AI Interviewer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>🤖 Go AI Interviewer</h1>
            <div class="nav-menu">
                <span id="username-display"></span>
                <button onclick="goBack()" class="btn btn-secondary">Back to Dashboard</button>
                <button onclick="logout()" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="interview-session">
            <div class="session-header">
                <h2>Interview Session</h2>
                <div id="session-info"></div>
            </div>

            <div class="two-column">
                <div class="left-panel">
                    <div class="card">
                        <h3>Add Question</h3>
                        <form id="addQuestionForm">
                            <div class="form-group">
                                <label for="category">Category</label>
                                <select id="category" required>
                                    <option value="algorithms">Algorithms</option>
                                    <option value="data_structures">Data Structures</option>
                                    <option value="system_design">System Design</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="difficulty">Difficulty</label>
                                <select id="difficulty" required>
                                    <option value="beginner">Beginner</option>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="advanced">Advanced</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Generate Question</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3>Questions</h3>
                        <div id="questions-list">
                            <p class="loading">Loading questions...</p>
                        </div>
                    </div>
                </div>

                <div class="right-panel">
                    <div class="card">
                        <h3>Coding Interface</h3>
                        <div id="current-question"></div>
                        
                        <div class="form-group">
                            <label for="language">Programming Language</label>
                            <select id="language">
                                <option value="go">Go</option>
                                <option value="python">Python</option>
                                <option value="java">Java</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="code-editor">Your Code</label>
                            <textarea id="code-editor" rows="15" placeholder="Write your code here..."></textarea>
                        </div>

                        <button onclick="submitCode()" class="btn btn-primary">Submit Code</button>
                        <button onclick="endInterview()" class="btn btn-danger">End Interview</button>
                    </div>

                    <div class="card" id="evaluation-results" style="display: none;">
                        <h3>Evaluation Results</h3>
                        <div id="results-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        const interviewId = window.location.pathname.split('/').pop();
        let currentQuestion = null;

        if (!token) {
            window.location.href = '/';
        }

        document.getElementById('username-display').textContent = `Welcome, ${username}`;

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        function goBack() {
            const role = localStorage.getItem('role');
            window.location.href = role === 'interviewer' ? '/dashboard' : '/candidate-dashboard';
        }

        async function loadSession() {
            try {
                const response = await fetch(`/api/interviews/${interviewId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const session = await response.json();
                    displaySessionInfo(session);
                    displayQuestions(session.questions || []);
                }
            } catch (error) {
                console.error('Error loading session:', error);
            }
        }

        function displaySessionInfo(session) {
            document.getElementById('session-info').innerHTML = `
                <div class="session-details">
                    <p><strong>Candidate:</strong> ${session.candidate_name} (${session.candidate_email})</p>
                    <p><strong>Status:</strong> <span class="status status-${session.status}">${session.status}</span></p>
                    <p><strong>Total Score:</strong> ${session.total_score.toFixed(1)}%</p>
                </div>
            `;
        }

        function displayQuestions(questions) {
            const container = document.getElementById('questions-list');
            
            if (questions.length === 0) {
                container.innerHTML = '<p>No questions added yet.</p>';
                return;
            }

            const html = questions.map(q => `
                <div class="question-item" onclick="selectQuestion('${q.id}')">
                    <strong>${q.title}</strong>
                    <span class="badge badge-${q.difficulty}">${q.difficulty}</span>
                    <span class="badge">${q.category}</span>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        async function selectQuestion(questionId) {
            try {
                const response = await fetch(`/api/interviews/${interviewId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const session = await response.json();
                    const question = session.questions.find(q => q.id === questionId);
                    if (question) {
                        currentQuestion = question;
                        displayCurrentQuestion(question);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displayCurrentQuestion(question) {
            document.getElementById('current-question').innerHTML = `
                <div class="question-details">
                    <h4>${question.title}</h4>
                    <p class="question-description">${question.description.replace(/\n/g, '<br>')}</p>
                    <p><strong>Time Limit:</strong> ${question.time_limit} seconds</p>
                    <div class="test-cases">
                        <strong>Test Cases:</strong>
                        ${question.test_cases.filter(tc => !tc.is_hidden).map((tc, i) => `
                            <div class="test-case">
                                <p><strong>Input ${i + 1}:</strong> ${tc.input}</p>
                                <p><strong>Expected Output:</strong> ${tc.expected_output}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        document.getElementById('addQuestionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const category = document.getElementById('category').value;
            const difficulty = document.getElementById('difficulty').value;

            try {
                const response = await fetch(`/api/interviews/${interviewId}/questions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ category, difficulty })
                });

                if (response.ok) {
                    const question = await response.json();
                    alert('Question added successfully!');
                    loadSession();
                    currentQuestion = question;
                    displayCurrentQuestion(question);
                } else {
                    alert('Failed to add question');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        async function submitCode() {
            if (!currentQuestion) {
                alert('Please select a question first');
                return;
            }

            const code = document.getElementById('code-editor').value;
            const language = document.getElementById('language').value;

            if (!code.trim()) {
                alert('Please write some code first');
                return;
            }

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        interview_id: interviewId,
                        question_id: currentQuestion.id,
                        code: code,
                        language: language
                    })
                });

                if (response.ok) {
                    const evaluation = await response.json();
                    displayEvaluation(evaluation);
                    loadSession();
                } else {
                    alert('Code submission failed');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Network error');
            }
        }

        function displayEvaluation(evaluation) {
            const resultsDiv = document.getElementById('evaluation-results');
            const content = document.getElementById('results-content');

            const passedIcon = evaluation.success ? '✅' : '❌';
            const scoreClass = evaluation.score >= 70 ? 'success' : 'warning';

            content.innerHTML = `
                <div class="evaluation-summary">
                    <h4>${passedIcon} ${evaluation.success ? 'All Tests Passed!' : 'Some Tests Failed'}</h4>
                    <p><strong>Score:</strong> <span class="score ${scoreClass}">${evaluation.score.toFixed(1)}%</span></p>
                    <p><strong>Tests Passed:</strong> ${evaluation.passed_test_cases} / ${evaluation.total_test_cases}</p>
                </div>

                <div class="code-quality">
                    <h4>Code Quality</h4>
                    <div class="quality-metrics">
                        <div class="metric">
                            <span>Readability:</span>
                            <div class="progress-bar">
                                <div class="progress" style="width: ${evaluation.code_quality.readability}%"></div>
                            </div>
                            <span>${evaluation.code_quality.readability}%</span>
                        </div>
                        <div class="metric">
                            <span>Efficiency:</span>
                            <div class="progress-bar">
                                <div class="progress" style="width: ${evaluation.code_quality.efficiency}%"></div>
                            </div>
                            <span>${evaluation.code_quality.efficiency}%</span>
                        </div>
                        <div class="metric">
                            <span>Best Practice:</span>
                            <div class="progress-bar">
                                <div class="progress" style="width: ${evaluation.code_quality.best_practice}%"></div>
                            </div>
                            <span>${evaluation.code_quality.best_practice}%</span>
                        </div>
                    </div>
                </div>

                <div class="feedback">
                    <h4>Feedback</h4>
                    <p>${evaluation.feedback.replace(/\n/g, '<br>')}</p>
                </div>

                <div class="test-results">
                    <h4>Test Results</h4>
                    ${evaluation.test_results.map((tr, i) => `
                        <div class="test-result ${tr.passed ? 'passed' : 'failed'}">
                            <strong>Test ${i + 1}:</strong> ${tr.passed ? '✅ Passed' : '❌ Failed'}
                            ${!tr.test_case.is_hidden ? `<p>Input: ${tr.test_case.input}</p>` : ''}
                            ${!tr.passed && tr.error ? `<p class="error">Error: ${tr.error}</p>` : ''}
                            ${!tr.passed && !tr.test_case.is_hidden ? `<p>Your Output: ${tr.output}</p>` : ''}
                            ${!tr.passed && !tr.test_case.is_hidden ? `<p>Expected: ${tr.test_case.expected_output}</p>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;

            resultsDiv.style.display = 'block';
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }

        async function endInterview() {
            if (!confirm('Are you sure you want to end this interview?')) {
                return;
            }

            try {
                const response = await fetch(`/api/interviews/${interviewId}/end`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    alert('Interview ended successfully!');
                    goBack();
                } else {
                    alert('Failed to end interview');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        loadSession();
    </script>
</body>
</html>
