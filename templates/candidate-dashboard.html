<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Dashboard - Go AI Interviewer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>🤖 Go AI Interviewer</h1>
            <div class="nav-menu">
                <span id="username-display"></span>
                <button onclick="logout()" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard">
            <h2>Candidate Dashboard</h2>
            
            <div class="card">
                <h3>Welcome!</h3>
                <p>Your interviewer will share an interview link with you. Use that link to start your interview.</p>
                <p>Or, if you have an interview ID, enter it below:</p>
                
                <form id="joinInterviewForm">
                    <div class="form-group">
                        <label for="interviewId">Interview ID</label>
                        <input type="text" id="interviewId" placeholder="Enter interview ID" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Join Interview</button>
                </form>
            </div>

            <div class="card">
                <h3>Recent Interviews</h3>
                <div id="interviews-list">
                    <p class="loading">Loading interviews...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        const role = localStorage.getItem('role');

        if (!token || role !== 'candidate') {
            window.location.href = '/';
        }

        document.getElementById('username-display').textContent = `Welcome, ${username}`;

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        document.getElementById('joinInterviewForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const interviewId = document.getElementById('interviewId').value;
            window.location.href = `/interview/${interviewId}`;
        });

        async function loadInterviews() {
            try {
                const response = await fetch('/api/interviews', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    displayInterviews(data.sessions || []);
                }
            } catch (error) {
                document.getElementById('interviews-list').innerHTML = '<p class="error">Failed to load interviews</p>';
            }
        }

        function displayInterviews(sessions) {
            const container = document.getElementById('interviews-list');
            
            if (sessions.length === 0) {
                container.innerHTML = '<p>No interviews yet.</p>';
                return;
            }

            const html = sessions.map(session => `
                <div class="interview-item">
                    <div class="interview-info">
                        <strong>Interview on ${new Date(session.start_time).toLocaleString()}</strong>
                        <span class="status status-${session.status}">${session.status}</span>
                    </div>
                    <div class="interview-actions">
                        <span>Score: ${session.total_score.toFixed(1)}%</span>
                        ${session.status === 'active' ? 
                            `<button onclick="joinInterview('${session.id}')" class="btn btn-small">Continue</button>` :
                            `<button onclick="viewInterview('${session.id}')" class="btn btn-small">View Results</button>`
                        }
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function joinInterview(id) {
            window.location.href = `/interview/${id}`;
        }

        function viewInterview(id) {
            window.location.href = `/interview/${id}`;
        }

        loadInterviews();
    </script>
</body>
</html>
